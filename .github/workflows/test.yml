# Her push ve pull request'te testler çalışır; "v" ile başlayan etikette (ör. v1.2) ya da elle
# (Actions → "Testler ve paket" → Run workflow) masaüstü paketi de üretilip indirilebilir dosya olarak eklenir.
name: Testler ve paket

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -o addopts= -q --cov=mac_tahmin --cov-report=term

  paket:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - run: python masaustu_paketle.py
      - uses: actions/upload-artifact@v4
        with:
          name: MacTahmin-windows
          path: dist/MacTahmin/
          retention-days: 30
